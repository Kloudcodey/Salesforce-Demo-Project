name: Apply pull request template

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  apply-template:
    runs-on: windows-latest
    steps:
      - name: Apply template based on source branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/^(feature|bugfix|hotfix|release)(?:\/|[-_]|$)/i);

            if (!match) {
              core.info(`No PR template matches source branch: ${branch}`);
              return;
            }

            const templateName = `${match[1].toLowerCase()}.md`;
            const templatePath = `.github/PULL_REQUEST_TEMPLATE/${templateName}`;
            const pullRequest = context.payload.pull_request;

            if (pullRequest.body?.trim()) {
              core.info('PR description is already populated; leaving it unchanged.');
              return;
            }

            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: templatePath,
              ref: context.payload.pull_request.base.ref,
            });

            if (Array.isArray(file) || file.type !== 'file') {
              throw new Error(`Template not found: ${templatePath}`);
            }

            const body = Buffer.from(file.content, 'base64').toString('utf8');
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              body,
            });
